[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lolcoach"
version = "1.1.1"
description = "League of Legends coaching dataset + RAG + QLoRA fine-tuning pipeline for local Qwen models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "torch>=2.3",
  "transformers>=4.44",
  "peft>=0.11",
  "trl>=0.9",
  "datasets>=2.19",
  "accelerate>=0.31",
  "bitsandbytes>=0.43; platform_system!='Darwin'",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "huggingface-hub>=0.23",
  "hf-xet>=1.1",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "tqdm>=4.66",
  "orjson>=3.10",
]

[project.optional-dependencies]
kaggle = ["kaggle>=1.6"]
judges = ["anthropic>=0.34", "openai>=1.40"]
unsloth = ["unsloth"]
ui = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
# Optional native window; the app falls back to the default browser.
desktop = ["pywebview>=5.0"]
bundle = ["pyinstaller>=6.10"]
dev = ["pytest>=8"]

[project.scripts]
lolcoach = "lolcoach.cli:app"

[tool.setuptools.packages.find]
include = ["lolcoach*"]

[tool.setuptools.package-data]
# The review UI ships as static files inside the package.
"lolcoach.web" = ["*.html", "*.css", "*.js", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
